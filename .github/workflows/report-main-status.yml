name: Report Main Workflow Status

on:
  workflow_run:
    workflows:
      - Main Validation and Phase Release
    types:
      - completed

permissions:
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish status ledger entry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ISSUE_NUMBER: "1"
        run: |
          set -euo pipefail
          jobs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")
          {
            printf '### Main workflow: `%s`\n\n' "$CONCLUSION"
            printf -- '- Run: [%s](%s)\n' "$RUN_ID" "$RUN_URL"
            printf -- '- Commit: `%s`\n\n' "$HEAD_SHA"
            echo '| Job ID | Job | Conclusion |'
            echo '| ---: | --- | --- |'
            jq -r '.jobs[] | "| \(.id) | \(.name) | \(.conclusion // .status) |"' \
              <<< "$jobs"
          } > /tmp/main-workflow-report.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/main-workflow-report.md
