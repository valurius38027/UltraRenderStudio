name: Snapshot All Workflow Status

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  issues: write

jobs:
  snapshot:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/snapshot-all-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish recent workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "1"
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30")
          {
            echo '### All workflow status snapshot'
            echo
            echo '| Workflow | Run ID | Commit | Status | Conclusion | Event |'
            echo '| --- | ---: | --- | --- | --- | --- |'
            jq -r '.workflow_runs[] | "| \(.name) | [\(.id)](\(.html_url)) | `\(.head_sha)` | \(.status) | \(.conclusion // "-") | \(.event) |"' \
              <<< "$runs"
          } > /tmp/all-workflows.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/all-workflows.md
