name: Dispatch Main Operations

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 1 &&
      (github.event.comment.body == '/run-main-validation' ||
       github.event.comment.body == '/snapshot-main-status' ||
       startsWith(github.event.comment.body, '/diagnose-main-run '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch or inspect main validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "1"
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          fetch_runs() {
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?branch=main&per_page=10"
          }

          publish_snapshot() {
            local runs=$1
            {
              echo '### Main workflow status snapshot'
              echo
              echo '| Run ID | Commit | Status | Conclusion | Event |'
              echo '| ---: | --- | --- | --- | --- |'
              jq -r '.workflow_runs[] | "| [\(.id)](\(.html_url)) | `\(.head_sha)` | \(.status) | \(.conclusion // "-") | \(.event) |"' \
                <<< "$runs"
            } > /tmp/main-status.md
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/main-status.md
          }

          diagnose_run() {
            local run_id=$1
            local jobs failed_count
            jobs=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
            failed_count=$(jq '[.jobs[] | select(.conclusion == "failure")] | length' <<< "$jobs")
            {
              printf '### Main workflow diagnostic: run `%s`\n\n' "$run_id"
              echo '| Job ID | Job | Conclusion |'
              echo '| ---: | --- | --- |'
              jq -r '.jobs[] | "| \(.id) | \(.name) | \(.conclusion // .status) |"' <<< "$jobs"
              echo
              if [[ $failed_count -eq 0 ]]; then
                echo 'No failed job is currently available for log extraction.'
              fi
            } > /tmp/diagnostic.md

            while IFS=$'\t' read -r job_id job_name; do
              raw="/tmp/job-$job_id.raw"
              text="/tmp/job-$job_id.txt"
              gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$raw"
              if unzip -tqq "$raw" >/dev/null 2>&1; then
                unzip -p "$raw" > "$text"
              else
                cp "$raw" "$text"
              fi
              matches="/tmp/job-$job_id.matches"
              grep -Eai -B 4 -A 14 \
                'LeakSanitizer|AddressSanitizer|UndefinedBehaviorSanitizer|The following tests FAILED|FAILED|Error:|##\[error\]' \
                "$text" > "$matches" || true
              {
                printf '#### Failed job `%s` (`%s`)\n\n' "$job_name" "$job_id"
                echo '```text'
                if [[ -s $matches ]]; then
                  tail -n 180 "$matches"
                else
                  tail -n 140 "$text"
                fi
                echo '```'
                echo
              } >> /tmp/diagnostic.md
            done < <(jq -r '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' <<< "$jobs")

            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/diagnostic.md
          }

          case "$COMMAND" in
            /snapshot-main-status)
              publish_snapshot "$(fetch_runs)"
              ;;
            /run-main-validation)
              before=$(fetch_runs | jq -r '.workflow_runs[0].id // 0')
              gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref main

              run_json=''
              for _ in $(seq 1 15); do
                runs=$(fetch_runs)
                run_json=$(jq -c --argjson before "$before" \
                  '.workflow_runs[] | select(.event == "workflow_dispatch" and .id > $before)' \
                  <<< "$runs" | head -n 1)
                if [[ -n $run_json ]]; then
                  break
                fi
                sleep 1
              done

              if [[ -z $run_json ]]; then
                echo 'workflow dispatch was accepted but the new run was not visible within 15 seconds' >&2
                exit 1
              fi

              run_id=$(jq -r '.id' <<< "$run_json")
              run_url=$(jq -r '.html_url' <<< "$run_json")
              status=$(jq -r '.status' <<< "$run_json")
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Accepted explicit main validation request from $COMMENT_URL. Run: [$run_id]($run_url), status: \`$status\`."
              ;;
            /diagnose-main-run\ *)
              run_id=${COMMAND#'/diagnose-main-run '}
              [[ $run_id =~ ^[0-9]+$ ]]
              diagnose_run "$run_id"
              ;;
            *)
              echo "unsupported command: $COMMAND" >&2
              exit 2
              ;;
          esac
