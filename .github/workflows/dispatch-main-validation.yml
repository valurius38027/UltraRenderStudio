name: Dispatch Main Operations

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 1 &&
      (github.event.comment.body == '/run-main-validation' ||
       github.event.comment.body == '/snapshot-main-status')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch requested operation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "1"
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            /run-main-validation)
              workflow=main.yml
              operation='main validation'
              ;;
            /snapshot-main-status)
              workflow=main-status-snapshot.yml
              operation='main status snapshot'
              ;;
            *)
              echo "unsupported command: $COMMAND" >&2
              exit 2
              ;;
          esac
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Accepted explicit $operation request from $COMMENT_URL."
