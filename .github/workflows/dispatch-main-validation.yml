name: Dispatch Main Operations

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 1 &&
      (github.event.comment.body == '/run-main-validation' ||
       github.event.comment.body == '/snapshot-main-status' ||
       github.event.comment.body == '/text-import-v2-status' ||
       github.event.comment.body == '/text-import-v2-diagnose-29846126763')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch or inspect repository workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "1"
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          fetch_main_runs() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?branch=main&per_page=10"
          }

          case "$COMMAND" in
            /snapshot-main-status)
              runs=$(fetch_main_runs)
              {
                echo '### Main workflow status snapshot'
                echo
                echo '| Run ID | Commit | Status | Conclusion | Event |'
                echo '| ---: | --- | --- | --- | --- |'
                jq -r '.workflow_runs[] | "| [\(.id)](\(.html_url)) | `\(.head_sha)` | \(.status) | \(.conclusion // "-") | \(.event) |"' <<< "$runs"
              } > /tmp/status.md
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
              ;;
            /text-import-v2-status)
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/diagnose-lsan.yml/runs?branch=main&per_page=10")
              latest=$(jq -r '.workflow_runs[0].id // empty' <<< "$runs")
              {
                echo '## Text importer v2 status'
                echo
                jq -r '.workflow_runs[] | "- run `\(.id)`: \(.status) / \(.conclusion // "-") at `\(.head_sha)`"' <<< "$runs"
                if [[ -n $latest ]]; then
                  echo
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$latest/jobs?per_page=100" --jq '.jobs[] | "- job `\(.id)` \(.name): \(.status) / \(.conclusion // "-")"'
                fi
              } > /tmp/status.md
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
              ;;
            /text-import-v2-diagnose-29846126763)
              job_id=88687059490
              gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > /tmp/job.log
              {
                echo '## Text importer v2 diagnostic'
                echo
                echo '```text'
                tail -n 140 /tmp/job.log
                echo '```'
              } > /tmp/status.md
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
              ;;
            /run-main-validation)
              before=$(fetch_main_runs | jq -r '.workflow_runs[0].id // 0')
              gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref main
              run_json=''
              for _ in $(seq 1 15); do
                runs=$(fetch_main_runs)
                run_json=$(jq -c --argjson before "$before" '.workflow_runs[] | select(.event == "workflow_dispatch" and .id > $before)' <<< "$runs" | head -n 1)
                [[ -z $run_json ]] || break
                sleep 1
              done
              [[ -n $run_json ]]
              run_id=$(jq -r '.id' <<< "$run_json")
              run_url=$(jq -r '.html_url' <<< "$run_json")
              status=$(jq -r '.status' <<< "$run_json")
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Accepted explicit main validation request from $COMMENT_URL. Run: [$run_id]($run_url), status: \`$status\`."
              ;;
          esac
