name: Apply Verified Text Phase Payload

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  report:
    if: >-
      github.event.issue.number == 1 &&
      (github.event.comment.body == '/text-import-status' ||
       startsWith(github.event.comment.body, '/text-import-diagnose '))
    runs-on: ubuntu-latest
    steps:
      - name: Report importer runs or failure tail
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ $COMMAND == '/text-import-status' ]]; then
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/diagnose-lsan.yml/runs?branch=main&per_page=5")
            {
              echo '## Text phase importer status'
              echo
              echo '| Run | Commit | Status | Conclusion | Event |'
              echo '| ---: | --- | --- | --- | --- |'
              jq -r '.workflow_runs[] | "| [\(.id)](\(.html_url)) | `\(.head_sha)` | \(.status) | \(.conclusion // "-") | \(.event) |"' <<< "$runs"
              latest=$(jq -r '.workflow_runs[0].id // empty' <<< "$runs")
              if [[ -n $latest ]]; then
                echo
                echo '### Latest jobs'
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$latest/jobs?per_page=100" \
                  --jq '.jobs[] | "- `\(.id)` \(.name): \(.status) / \(.conclusion // "-")"'
              fi
            } > /tmp/import-report.md
          else
            run_id=${COMMAND#'/text-import-diagnose '}
            [[ $run_id =~ ^[0-9]+$ ]]
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
            job_id=$(jq -er '.jobs[] | select(.conclusion == "failure") | .id' <<< "$jobs" | head -n 1)
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > /tmp/job.log
            {
              printf '## Text importer diagnostic: run `%s`, job `%s`\n\n' "$run_id" "$job_id"
              echo '```text'
              tail -n 120 /tmp/job.log
              echo '```'
            } > /tmp/import-report.md
          fi
          gh issue edit 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/import-report.md

  apply:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/apply-text-phase-d187f83'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out canonical main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0

      - name: Restore verified payload and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_SHA256: 001f46a0560ec28ec6b20ef710eca5c1565d6b52fd08c6f7032743d06a2ed86f
          VERT_SHA256: d7320f79ee44f77d5c1b1f6d48c676e2f760b98fb6397f95ba2282aa751c708d
          FRAG_SHA256: 896742f61a4df22510cefdd4ee34b026ae5a1a283012c1df29256a0722a63f59
        run: |
          set -euo pipefail
          : > /tmp/payload.tar.xz
          for blob in \
            dc8b415c7761a4bc7ad8a7434906a911cf53be10 \
            d95ce5b487903f82d86d169f1a6557b26cc16542 \
            ab9cef107850445cb4e2df2008b7a89b5260ce35 \
            780e40d83a7423f6e1cd9b4e174910b023ad6e44 \
            6413a25c39c89b2e18af1fc34a8a238cdd1fcc3b \
            f50ac255f49e85b9af55cc1fd2fcb00e0b298d99 \
            a7af479d45e2dd7da93dc909dc75982f19d5f822 \
            33094680b7e4fd1f28fe3ddc202a471b3dc5486f \
            de4c332482eac15ac1ace1a020b9cb53c5fe9653; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content \
              | tr -d '\n' | base64 -d >> /tmp/payload.tar.xz
          done
          echo "$PAYLOAD_SHA256  /tmp/payload.tar.xz" | sha256sum -c -
          tar -xJf /tmp/payload.tar.xz -C .
          rm -f docs/operations/.probe

          git clone --depth 1 https://github.com/valurius38027/toolchain.git /tmp/ultrarender-toolchain
          sudo bash /tmp/ultrarender-toolchain/profiles/ultrarender/scripts/restore.sh \
            ultrarender-sdk-debian13-v2026.07.21.1

          bash tools/maintenance/generate_glyph_shaders.sh
          echo "$VERT_SHA256  libs/ur_gfx/src/shaders/glyph.vert.qsb" | sha256sum -c -
          echo "$FRAG_SHA256  libs/ur_gfx/src/shaders/glyph.frag.qsb" | sha256sum -c -
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: close minimal text rendering and codify operations'
          git push origin HEAD:main
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" \
            --body 'Applied the verified Minimal Text Rendering payload, regenerated both QShader packages with SDK `2026.07.21.1`, verified all transport and shader digests, removed the probe file, and pushed the coherent phase commit to `main`.'
