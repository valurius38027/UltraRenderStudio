name: Diagnose Main Failures

on:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose-lsan:
    if: >-
      github.event.issue.number == 1 &&
      startsWith(github.event.comment.body, '/diagnose-lsan-run ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract complete LeakSanitizer stack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ github.event.comment.body }}
          DIAGNOSTIC_ISSUE: "2"
        run: |
          set -euo pipefail
          run_id=${COMMAND#'/diagnose-lsan-run '}
          [[ $run_id =~ ^[0-9]+$ ]]

          jobs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
          job_id=$(jq -er '.jobs[] | select(.conclusion == "failure") | .id' \
            <<< "$jobs" | head -n 1)
          job_name=$(jq -er --argjson id "$job_id" \
            '.jobs[] | select(.id == $id) | .name' <<< "$jobs")

          raw=/tmp/job.raw
          text=/tmp/job.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$raw"
          if unzip -tqq "$raw" >/dev/null 2>&1; then
            unzip -p "$raw" > "$text"
          else
            cp "$raw" "$text"
          fi

          grep -E 'LSAN_OPTIONS|ASAN_OPTIONS|VK_ICD_FILENAMES' "$text" \
            > /tmp/environment.txt || true
          awk '
            /ERROR: LeakSanitizer/ { capture = 1 }
            capture { print }
            /SUMMARY: AddressSanitizer/ { exit }
          ' "$text" > /tmp/leak.txt

          if [[ ! -s /tmp/leak.txt ]]; then
            echo 'LeakSanitizer section not found in job log.' > /tmp/leak.txt
            tail -n 200 "$text" >> /tmp/leak.txt
          fi

          {
            echo '# CI diagnostic: GCC LeakSanitizer'
            echo
            printf -- '- Run: `%s`\n' "$run_id"
            printf -- '- Failed job: `%s` (`%s`)\n' "$job_name" "$job_id"
            echo
            echo '## Sanitizer environment'
            echo
            echo '```text'
            cat /tmp/environment.txt
            echo '```'
            echo
            echo '## Complete LeakSanitizer section'
            echo
            echo '```text'
            sed -E 's/^.*Z //' /tmp/leak.txt | head -n 500
            echo '```'
          } > /tmp/diagnostic-body.md

          gh issue edit "$DIAGNOSTIC_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/diagnostic-body.md

  diagnose-release:
    if: >-
      github.event.issue.number == 1 &&
      startsWith(github.event.comment.body, '/diagnose-release-run ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract phase Release failure tail
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ github.event.comment.body }}
          DIAGNOSTIC_ISSUE: "4"
        run: |
          set -euo pipefail
          run_id=${COMMAND#'/diagnose-release-run '}
          [[ $run_id =~ ^[0-9]+$ ]]

          jobs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
          job_id=$(jq -er '.jobs[] | select(.name == "release-phase" and .conclusion == "failure") | .id' \
            <<< "$jobs" | head -n 1)

          raw=/tmp/job.raw
          text=/tmp/job.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$raw"
          if unzip -tqq "$raw" >/dev/null 2>&1; then
            unzip -p "$raw" > "$text"
          else
            cp "$raw" "$text"
          fi

          {
            echo '# CI diagnostic: phase Release'
            echo
            printf -- '- Run: `%s`\n' "$run_id"
            printf -- '- Failed job: `release-phase` (`%s`)\n' "$job_id"
            echo
            echo '## Failure tail'
            echo
            echo '```text'
            tail -n 180 "$text" | sed -E 's/^.*Z //'
            echo '```'
          } > /tmp/release-diagnostic.md

          gh issue edit "$DIAGNOSTIC_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/release-diagnostic.md
