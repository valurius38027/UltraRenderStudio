name: Apply Verified Text Phase Payload

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/apply-text-phase-v3-7bdf2623'
    runs-on: ubuntu-latest
    container:
      image: debian:13
    timeout-minutes: 35
    steps:
      - name: Install importer bootstrap
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gh git jq xz-utils zstd

      - name: Check out canonical main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0

      - name: Restore verified payload and commit
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_SHA256: 7bdf262368d1827c49aee926e1b425bfd1babc1e718bdb46d462692f9b749e5e
          VERT_SHA256: d7320f79ee44f77d5c1b1f6d48c676e2f760b98fb6397f95ba2282aa751c708d
          FRAG_SHA256: 896742f61a4df22510cefdd4ee34b026ae5a1a283012c1df29256a0722a63f59
        run: |
          set -euo pipefail
          repo_root=$GITHUB_WORKSPACE
          test -e "$repo_root/.git"
          : > /tmp/payload.tar.xz
          for blob in \
            a666833eda349f51c222160ad94418a1521f4e64 \
            3bb7f8f0c9914088e7385f25136a00f0fab7b5a5 \
            a5875c953fb6d8bb7dca766e361f92e1c297b68c \
            3ba9099f8015575e75ac86db4a8a03bb833797f3 \
            bbea6c8a8bc537de27223680bfb8c3dbbba87a98 \
            c471982186d38db39372d9938e5d0f4bb6549be4 \
            48fc97fb882296f715a2754848dae2169239b95b \
            654fa3577be309c2c30dc196f8f3dc301a3644e9 \
            07ff996b2696e3cbf7487b3f2987ddfade46f8b9 \
            e19d5bb4260042de9335f217d33b3ac8c07ffe58 \
            757a99cad6ad9a857152fc21b2019c6a61ae5946 \
            ca032c3c757b8f64385da2cd3fc6cf0e0e376671 \
            bd08848fe57ab8b1ea3c782f17335a50a5eda055 \
            9688be5322ef1878ae3805bab645757054861397 \
            5b37c836ea79cc1550af86b41df5322bfc308897 \
            73d07d8dcbe622391c0a50c1bce3d3d4d99a5406 \
            218750f0448b98b5c74df7b4ec2929d175b0fd27 \
            60895232b8f8a35c2d4903dec64e512304e894b3 \
            293c0fd8fe3d977d7c04c7e23a2f0416b9e5bc82 \
            eb7515eb0ef62e690c4bcc953e3b782c12967584 \
            e7ab77794631f402789e3c83a9a675165af45edf \
            c60c9707175bd56d51bab3ab9edc3f795aa66f65 \
            b1c256ee181769f9c8e32f073479cb5a251e62ee; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content \
              | tr -d '\n' | base64 -d >> /tmp/payload.tar.xz
          done
          echo "$PAYLOAD_SHA256  /tmp/payload.tar.xz" | sha256sum -c -
          tar -xJf /tmp/payload.tar.xz -C "$repo_root"
          rm -f "$repo_root/docs/operations/.probe"

          git clone --depth 1 https://github.com/valurius38027/toolchain.git /tmp/ultrarender-toolchain
          bash /tmp/ultrarender-toolchain/profiles/ultrarender/scripts/restore.sh \
            ultrarender-sdk-debian13-v2026.07.21.1

          test -e "$repo_root/.git"
          bash "$repo_root/tools/maintenance/generate_glyph_shaders.sh"
          echo "$VERT_SHA256  $repo_root/libs/ur_gfx/src/shaders/glyph.vert.qsb" | sha256sum -c -
          echo "$FRAG_SHA256  $repo_root/libs/ur_gfx/src/shaders/glyph.frag.qsb" | sha256sum -c -
          git -C "$repo_root" diff --check

          git -C "$repo_root" config user.name 'github-actions[bot]'
          git -C "$repo_root" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$repo_root" add -A
          git -C "$repo_root" commit -m 'feat: close minimal text rendering phase'
          git -C "$repo_root" push origin HEAD:main
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" \
            --body 'Applied the checksum-verified Minimal Text Rendering payload, regenerated both QShader packages with SDK `2026.07.21.1`, and pushed the coherent phase commit to `main`.'
