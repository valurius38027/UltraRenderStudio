name: Snapshot Main Workflow Status

on:
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish recent main runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "1"
        run: |
          set -euo pipefail
          runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?branch=main&per_page=10")
          {
            echo '### Main workflow status snapshot'
            echo
            echo '| Run ID | Commit | Status | Conclusion | Event |'
            echo '| ---: | --- | --- | --- | --- |'
            jq -r '.workflow_runs[] | "| \(.id) | `\(.head_sha)` | \(.status) | \(.conclusion // "-") | \(.event) |"' \
              <<< "$runs"
          } > /tmp/main-status-snapshot.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/main-status-snapshot.md
