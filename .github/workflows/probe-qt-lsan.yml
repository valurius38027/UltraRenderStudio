name: Probe Qt LeakSanitizer Ownership

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/probe-qt-lsan'
    runs-on: ubuntu-latest
    container:
      image: debian:13
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - name: Bootstrap checkout dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git jq zstd

      - name: Check out source and toolchain
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Check out persistent toolchain
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: valurius38027/toolchain
          ref: main
          path: .toolchain

      - name: Restore SDK
        shell: bash
        run: |
          set -euo pipefail
          bash .toolchain/profiles/ultrarender/scripts/restore.sh latest \
            --cache-dir /var/cache/ultrarender-sdk

      - name: Build minimal Qt probes and ur_gfx_tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qt-lsan-probe
          cat > /tmp/qt-lsan-probe/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(QtLsanProbe LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(Qt6 REQUIRED COMPONENTS Core Gui)
          foreach(target IN ITEMS qgui_only qgui_vulkan)
            add_executable(${target} ${target}.cpp)
            target_link_libraries(${target} PRIVATE Qt6::Core Qt6::Gui)
            target_compile_options(${target} PRIVATE -fsanitize=address -fno-omit-frame-pointer)
            target_link_options(${target} PRIVATE -fsanitize=address)
          endforeach()
          EOF
          cat > /tmp/qt-lsan-probe/qgui_only.cpp <<'EOF'
          #include <QGuiApplication>
          int main(int argc, char** argv) {
              QGuiApplication application(argc, argv);
              return 0;
          }
          EOF
          cat > /tmp/qt-lsan-probe/qgui_vulkan.cpp <<'EOF'
          #include <QGuiApplication>
          #include <QVulkanInstance>
          int main(int argc, char** argv) {
              QGuiApplication application(argc, argv);
              QVulkanInstance instance;
              if (!instance.create()) {
                  return 2;
              }
              instance.destroy();
              return 0;
          }
          EOF
          cmake -S /tmp/qt-lsan-probe -B /tmp/qt-lsan-probe/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
          cmake --build /tmp/qt-lsan-probe/build --parallel 2

          cmake -S . -B build/lsan-probe -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUR_BUILD_TESTS=ON \
            -DUR_WARNINGS_AS_ERRORS=ON \
            -DUR_ENABLE_SANITIZERS=ON
          cmake --build build/lsan-probe --target ur_gfx_tests --parallel 2

      - name: Run ownership probes
        shell: bash
        run: |
          set -euo pipefail
          run_probe() {
            local name=$1
            shift
            set +e
            LSAN_OPTIONS='print_suppressions=1' xvfb-run -a "$@" \
              > "/tmp/$name.log" 2>&1
            local rc=$?
            set -e
            printf '%s=%s\n' "$name" "$rc" >> /tmp/results.env
          }

          run_probe qgui_only /tmp/qt-lsan-probe/build/qgui_only
          run_probe qgui_vulkan /tmp/qt-lsan-probe/build/qgui_vulkan
          run_probe ur_gfx_without_suppression \
            "$GITHUB_WORKSPACE/build/lsan-probe/libs/ur_gfx/ur_gfx_tests"

          printf 'leak:QGenericUnixServices::QGenericUnixServices\n' \
            > /tmp/qgenericunixservices.supp
          set +e
          LSAN_OPTIONS="suppressions=/tmp/qgenericunixservices.supp:print_suppressions=1" \
            xvfb-run -a "$GITHUB_WORKSPACE/build/lsan-probe/libs/ur_gfx/ur_gfx_tests" \
            > /tmp/ur_gfx_targeted_suppression.log 2>&1
          targeted_rc=$?
          set -e
          printf 'ur_gfx_targeted_suppression=%s\n' "$targeted_rc" >> /tmp/results.env

      - name: Publish probe evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_ISSUE: "2"
        run: |
          set -euo pipefail
          {
            echo '# CI diagnostic: Qt platform LeakSanitizer ownership probe'
            echo
            echo '## Exit codes'
            echo
            echo '```text'
            cat /tmp/results.env 2>/dev/null || echo 'probe did not produce results'
            echo '```'
            for name in qgui_only qgui_vulkan ur_gfx_without_suppression ur_gfx_targeted_suppression; do
              echo
              printf '## `%s`\n\n' "$name"
              echo '```text'
              if [[ -f /tmp/$name.log ]]; then
                grep -E -A 40 -B 3 \
                  'ERROR: LeakSanitizer|SUMMARY: AddressSanitizer|Suppressions used|PASSED' \
                  "/tmp/$name.log" | tail -n 160 || tail -n 80 "/tmp/$name.log"
              else
                echo 'log unavailable'
              fi
              echo '```'
            done
          } > /tmp/probe-report.md
          jq -Rs '{body: .}' /tmp/probe-report.md > /tmp/probe-payload.json
          curl -fsSL \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/probe-payload.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$DIAGNOSTIC_ISSUE" \
            >/dev/null
